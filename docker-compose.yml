services:
  mediafinder:
    build: .
    container_name: mediafinder
    restart: unless-stopped
    # Host networking lets MediaFinder find Jellyfin servers on your LAN via broadcast
    # (the same way Jellyfin's own apps do). It listens on port 8080 of the host.
    # Prefer a bridged network? Remove `network_mode` and uncomment `ports` - discovery
    # then works by scanning an IP range you enter in the UI instead of broadcast.
    network_mode: host
    # ports:
    #   - "8080:8080"
    volumes:
      - ./data:/data
      # Optional: if you'd rather mount the NAS than connect over SMB:
      # - /mnt/nas/media:/media:ro
